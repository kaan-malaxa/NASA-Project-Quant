name: Python pipeline
on:
  push:
    paths: ["pipeline/**", "pyproject.toml"]
  pull_request:
    paths: ["pipeline/**", "pyproject.toml"]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check pipeline
      - run: uv run pytest -q

# Owner: R5. Builds the static site in web/ and deploys it to GitHub Pages at https://kaan-malaxa.github.io/NASA-Project-Quant/.
# JavaScript is checked by the installed compiler against generated contract declarations.
name: web

on:
  push:
    branches: [main]
    paths: ["web/**", "contracts/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "contracts/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:types
      - run: git diff --exit-code -- src/data/types.gen.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - run: npm run build
        # Custom domain prometheus-torch.design disabled until its DNS and HTTPS work. To re-enable: VITE_BASE "/", VITE_SITE_URL https://prometheus-torch.design/, and restore the CNAME file.
        env:
          VITE_BASE: /NASA-Project-Quant/
          VITE_SITE_URL: https://kaan-malaxa.github.io/NASA-Project-Quant/
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

[project]
name = "firerosetta"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "duckdb", "pandas", "pyarrow", "numpy", "scipy", "h3>=4", "pyyaml",
  "requests", "jsonschema", "matplotlib", "python-dotenv", "tqdm",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["pipeline"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

limitations:
- Only daytime detections are used in this version. Night-time detections are kept in the data but not shown.
- Near-real-time detections are filtered per map cell by a static heat-source mask; standard detections are filtered
  one by one.
- From 2026 the record uses NOAA-20 with the S-NPP eyesight curve, assuming the two instruments see fires the same
  way.
- Fire cell-days describe the spread of satellite-detected burning activity, not burned area, fire counts, severity
  or damage.
- The analysis covers the approved whole-US polygon, including Alaska and Hawaii. A display wrap does not change
  membership.
- Calibration measured across the whole region is applied to smaller selected areas. Small areas can have different
  detection conditions.
- Cloud, smoke, viewing geometry and overpass time can affect detections; coverage rules cannot measure every missed
  observation.
- Recent activity remains unavailable until genuine near-real-time detections and independent coverage metadata
  exist.
- The trend always uses the count-based translation. The eyesight route is used for the estimated historical lens
  only when it passes the fixed acceptance tests.
- Pooled reliability can cancel errors of opposite sign across years. The separately reported absolute-year diagnostic
  exposes that cancellation.
- Anomaly ranks use the fixed configured historical baseline; selected-period seasons use only the selected complete
  years.
- Spatial maps exclude years with missing required bins. Published sparse contributions omit covered zero cells
  but retain missing bins as null.

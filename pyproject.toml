[project]
name = "prometheus-torch"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "duckdb", "pandas", "pyarrow", "numpy", "scipy", "h3>=4", "pyyaml",
  "requests", "jsonschema", "matplotlib", "python-dotenv", "tqdm",
]

[project.optional-dependencies]
# Optional OpenCL GPU acceleration (any vendor); results are identical with or without it.
gpu = ["pyopencl>=2024.1"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["pipeline"]
# Several stages have test files with the same basename (test_planted_truth.py, conftest.py).
addopts = "--import-mode=importlib"
pythonpath = ["."]
